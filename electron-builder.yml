appId: com.terrabyte.radar
productName: RADAR
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - dmg
linux:
  category: Utility
  icon: build/icon.png
  target:
    - AppImage
# Auto-update source (electron-updater reads this at runtime). Releases publish here;
# see docs/RELEASING.md. Update `repo` if the GitHub repository name changes.
publish:
  provider: github
  owner: TerraByte-Dev
  repo: RADAR
  # electron-builder defaults to a DRAFT release, and electron-updater cannot see drafts — the
  # update would upload correctly and reach nobody. Publish straight to a real release instead.
  releaseType: release
