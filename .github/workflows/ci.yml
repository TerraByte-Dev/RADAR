name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: typecheck + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows matters: the engine's atomic write retries through transient
        # Windows file locks, so the suite must stay green on win32 too.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (relinks the radar-blip workspace)
        run: npm ci
      - name: Typecheck (engine build + node + web)
        run: npm run typecheck
      - name: Test (app + engine)
        run: npm test
      # Build the app itself, unpacked (no installer, no signing, nothing published), so a
      # broken electron-builder config or a missing packaged resource fails the PR.
      - name: Build the app (electron-builder --dir)
        if: matrix.os == 'windows-latest'
        run: npm run package -- --dir --publish never
